# 放到 GitHub 仓库的 .github/workflows/to-zenodo.yml
# 作用：把 Release 里的分片按 order.txt 拼回一个 zenodo.zip（sha256 校验），
#       再用 legacy bucket 接口（官方给大文件用的通道，curl 带自动重试）上传到 Zenodo 草稿。
name: relay-release-to-zenodo

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag"
        required: true
        default: "rawdata-v1"
      record:
        description: "Zenodo draft id"
        required: true
        default: "23264767"
      pattern:
        description: "分片文件通配符"
        required: true
        default: "zenodo.zip.*"
      filename:
        description: "拼好后的文件名（也是 Zenodo 上的文件名）"
        required: true
        default: "zenodo.zip"
  release:
    types: [published]

permissions:
  contents: write

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Download the parts (inside GitHub's network)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          PATTERN: ${{ inputs.pattern || 'zenodo.zip.*' }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$PATTERN" --dir parts
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "order.txt" --dir .
          echo "parts: $(ls parts | wc -l), manifest lines: $(wc -l < order.txt)"

      - name: Reassemble and verify
        env:
          FILE: ${{ inputs.filename || 'zenodo.zip' }}
          EXPECTED_SHA256: "33da5e938ca5fdc65a3b25abaceb3de2266c87efb01de05eea109c99211d19b2"
        run: |
          while read -r n; do cat "parts/$n"; done < order.txt > "$FILE"
          ls -l "$FILE"
          ACTUAL=$(sha256sum "$FILE" | cut -d' ' -f1)
          echo "sha256: $ACTUAL"
          if [ "$ACTUAL" != "$EXPECTED_SHA256" ]; then
            echo "::error::sha256 mismatch - abort"; exit 1
          fi

      - name: Upload via the legacy bucket endpoint (documented path for big files)
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
          RECORD: ${{ inputs.record || '23264767' }}
          KEY: ${{ inputs.filename || 'zenodo.zip' }}
        run: |
          set -e
          python3 - <<'PY'
          import json, os, urllib.request as u
          TOKEN, REC, KEY = os.environ["ZENODO_TOKEN"], os.environ["RECORD"], os.environ["KEY"]
          API = "https://zenodo.org/api"

          def call(method, path):
              req = u.Request(API + path, method=method, headers={"Authorization": "Bearer " + TOKEN})
              with u.urlopen(req, timeout=180) as r:
                  b = r.read()
                  return json.loads(b) if b else {}

          for e in call("GET", "/records/%s/draft/files" % REC).get("entries", []):
              if e["key"] == KEY:
                  print("deleting stale entry:", e.get("size"), e.get("status"))
                  call("DELETE", "/records/%s/draft/files/%s" % (REC, KEY))

          info = call("GET", "/deposit/depositions/%s" % REC)
          bucket = info["links"]["bucket"]
          print("bucket:", bucket)
          open("bucket.txt", "w").write(bucket)
          PY
          BUCKET=$(cat bucket.txt)
          echo "uploading $(stat -c%s "$KEY") bytes to $BUCKET/$KEY"
          curl --progress-bar --fail --retry 6 --retry-delay 20 --retry-all-errors \
               --upload-file "$KEY" \
               -H "Authorization: Bearer $ZENODO_TOKEN" \
               -o /dev/null -w "upload http %{http_code}, %{size_upload} bytes, %{speed_upload} B/s\n" \
               "$BUCKET/$KEY"
          echo "== files in the draft =="
          python3 - <<'PY'
          import json, os, urllib.request as u
          TOKEN, REC = os.environ["ZENODO_TOKEN"], os.environ["RECORD"]
          req = u.Request("https://zenodo.org/api/records/%s/draft/files" % REC,
                          headers={"Authorization": "Bearer " + TOKEN})
          with u.urlopen(req, timeout=120) as r:
              data = json.load(r)
          for e in data.get("entries", []):
              print("   %-28s %12s bytes  %s" % (e["key"], e.get("size"), e.get("status")))
          print("done: https://zenodo.org/uploads/%s" % REC)
          PY
